<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizonte | Reservar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="fundo">
        <header>
            <div class="logo-container">
                <img src="images/logo.png" alt="Ícone Horizonte" class="logo-img">
            </div><h1>HORIZONTE</h1>
        </header>
            <nav>
                <ul>
                    <li><a href="index.html">Brasil</a></li>
                    <li><a href="franca.html">França</a></li>
                    <li><a href="japao.html">Japão</a></li>
                    <li><a href="egito.html">Egito</a></li>
                    <li><a href="reserva.html">Roteiro</a></li>
                </ul>
            </nav>

        <section class="secao-formulario">
        <h3>Solicite seu Roteiro Personalizado</h3>
        <p>Preencha os campos abaixo e nossos especialistas entrarão em contato.</p>

        <form class="meu-formulario">
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail de Contato:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="campo">
                <label for="destino">Destino de Interesse:</label>
                <select id="destino" name="destino">
                    <option value="egito">Egito (Pirâmides)</option>
                    <option value="brasil">Brasil (Natureza)</option>
                    <option value="japao">Japão (Tradição)</option>
                    <option value="franca">França (Cultura)</option>
                </select>
            </div>

            <div class="campo">
                <label for="data">Previsão da Viagem:</label>
                <input type="date" id="data" name="data">
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem/Preferências:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Conte-nos mais sobre sua viagem ideal..."></textarea>
                </div>

            <button type="submit" class="botao-enviar">Enviar Solicitação</button>
        </form>
    </section>
    <footer>
        <p>Contato: concierge@horizonte.com | +55 38 9999-9999</p>
            <p>Siga nossa jornada no Instagram e Facebook</p>
    </footer>
    </div>

    
</body>
</html>
